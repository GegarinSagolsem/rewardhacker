name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit + API tests (SQLite, in-memory traces; no cloud services)
        run: uv run pytest tests/test_core.py tests/test_adversary.py tests/test_api.py tests/test_api_data.py -q
      - name: LoopBench (Docker end-to-end)
        run: uv run pytest tests/test_loopbench.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src
      - name: Type-check and build
        run: npm run build
