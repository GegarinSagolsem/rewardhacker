name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest tests/test_core.py -q
      - name: LoopBench (Docker end-to-end)
        run: uv run pytest tests/test_loopbench.py -q
