[project]
name = "rewardhacker"
version = "0.1.0"
description = "Red-team your rewards: find RL coding tasks that can be passed without doing the work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sagolsem Gegarin Singh" }]
keywords = ["reinforcement-learning", "evals", "reward-hacking", "ai-agents", "benchmarks"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["google-genai>=1.20"]

[project.scripts]
rh = "rewardhacker.cli:app"
rewardhacker = "rewardhacker.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewardhacker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
